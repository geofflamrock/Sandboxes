name: Sandboxes
options:
  bundleIdPrefix: com.geofflamrock
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  # Installs updates. An exact version, since the generated project isn't
  # committed and so has no Package.resolved to pin it. CI downloads the same
  # version's tools to sign releases (SPARKLE_VERSION in build.yml).
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
settings:
  base:
    # Placeholders for local builds. CI overrides both: releases take the
    # version from the tag, other builds the next minor version after the
    # latest release, and every CI build uses the workflow run number as the
    # build number.
    MARKETING_VERSION: "0.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # Shown next to the version for non-release builds, e.g. "PR #12 · abc1234".
    # CI sets it to an empty string for releases.
    SANDBOXES_BUILD_LABEL: Local
    # The public half of the EdDSA key that signs releases, from Sparkle's
    # generate_keys. The private half is the SPARKLE_PRIVATE_KEY secret in CI.
    # Without it, the app doesn't start Sparkle, so it never checks for updates.
    SPARKLE_PUBLIC_ED_KEY: OjNHDzyHyKpyVpUteQJdmbaMS1j3btEcmcC8xEiq2vI=
    SWIFT_VERSION: "5.0"
targets:
  Sandboxes:
    type: application
    platform: macOS
    dependencies:
      - package: Sparkle
    sources:
      - Sources/Sandboxes
      # The Icon Composer app icon. Xcode compiles it into the app icon.
      - path: Design/AppIcon.icon
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Sandboxes
        CFBundleDisplayName: Sandboxes
        # XcodeGen otherwise writes fixed defaults (1.0 and 1).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
        SandboxesBuildLabel: $(SANDBOXES_BUILD_LABEL)
        # Sparkle reads the appcast attached to the latest release, and checks
        # every 6 hours without asking first.
        SUFeedURL: https://github.com/geofflamrock/Sandboxes/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
    settings:
      base:
        PRODUCT_NAME: Sandboxes
        PRODUCT_BUNDLE_IDENTIFIER: com.geofflamrock.sandboxes
        # Design/AppIcon.icon, made in Icon Composer from layers that
        # scripts/generate-app-icon.py writes.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The app launches the sbx CLI, so it can't run inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme: {}
