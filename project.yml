name: sbx-manager
options:
  bundleIdPrefix: com.geofflamrock
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  sbx-manager:
    type: application
    platform: macOS
    sources:
      - Sources/sbx-manager
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Docker Sandboxes Manager
        CFBundleDisplayName: Docker Sandboxes Manager
        LSApplicationCategoryType: public.app-category.developer-tools
        NSHumanReadableCopyright: ""
    settings:
      base:
        # File name sbx-manager.app; the menu bar and Dock use CFBundleName.
        PRODUCT_NAME: sbx-manager
        PRODUCT_BUNDLE_IDENTIFIER: com.geofflamrock.sbx-manager
        # The app launches the sbx CLI, so it can't run inside the App Sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        DEVELOPMENT_TEAM: ""
    scheme: {}
