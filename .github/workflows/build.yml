name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Matches the Sparkle package version in project.yml.
  SPARKLE_VERSION: 2.10.0

jobs:
  build:
    name: Build Sandboxes.app
    runs-on: macos-26
    outputs:
      dmg: ${{ steps.package.outputs.dmg }}
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # Releases take their version from the tag (v1.2.3 or 1.2.3) and have no
      # build label. Other builds are ahead of the latest release, so they take
      # the next minor version (v0.4.0 gives 0.5.0) and are labelled with where
      # they came from and the commit, e.g. "PR #12 · abc1234", so they're easy
      # to tell apart in the app.
      - name: Work out version
        id: version
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.release.tag_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # The PR's own commit, not the merge commit the workflow checks out.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ "$EVENT" = release ]; then
            version="${TAG#v}"
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Release tag '$TAG' must look like v1.2.3 or 1.2.3"
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "label=" >> "$GITHUB_OUTPUT"
            echo "suffix=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The checkout is shallow and has no tags, so list them from the remote.
          latest=$(git ls-remote --tags --refs origin \
            | sed -E 's|.*refs/tags/v?||' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' \
            | sort -V | tail -n 1)
          IFS=. read -r major minor _ <<< "${latest:-0.0.0}"
          version="$major.$((minor + 1)).0"
          short_sha="${SHA:0:7}"
          echo "Latest release: ${latest:-none}, building $version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

          if [ "$EVENT" = pull_request ]; then
            echo "label=PR #$PR_NUMBER · $short_sha" >> "$GITHUB_OUTPUT"
            echo "suffix=-pr$PR_NUMBER-$short_sha" >> "$GITHUB_OUTPUT"
          else
            echo "label=$REF_NAME · $short_sha" >> "$GITHUB_OUTPUT"
            echo "suffix=-build$GITHUB_RUN_NUMBER-$short_sha" >> "$GITHUB_OUTPUT"
          fi

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          LABEL: ${{ steps.version.outputs.label }}
        run: |
          settings=(
            "CURRENT_PROJECT_VERSION=$GITHUB_RUN_NUMBER"
            "SANDBOXES_BUILD_LABEL=$LABEL"
            "CODE_SIGN_IDENTITY=-"
            "CODE_SIGN_STYLE=Manual"
            "MARKETING_VERSION=$VERSION"
          )
          xcodebuild build \
            -project Sandboxes.xcodeproj \
            -scheme Sandboxes \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            "${settings[@]}"

      - name: Show bundle details
        run: |
          app=build/Build/Products/Release/Sandboxes.app
          plist=$app/Contents/Info.plist
          for key in CFBundleName CFBundleExecutable CFBundleShortVersionString CFBundleVersion SandboxesBuildLabel SUFeedURL SUPublicEDKey; do
            echo "$key: $(/usr/libexec/PlistBuddy -c "Print :$key" "$plist")"
          done
          if ! [ -d "$app/Contents/Frameworks/Sparkle.framework" ]; then
            echo "::error::Sparkle.framework isn't embedded in the app"
            exit 1
          fi
          codesign --verify --deep --strict --verbose=2 "$app"

      # The DMG window shows the app next to an Applications shortcut to drag it onto.
      - name: Package DMG
        id: package
        env:
          SUFFIX: ${{ steps.version.outputs.suffix }}
        run: |
          app=build/Build/Products/Release/Sandboxes.app
          version=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$app/Contents/Info.plist")
          dmg="Sandboxes-$version$SUFFIX.dmg"
          mkdir dmg
          ditto "$app" dmg/Sandboxes.app
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners, so retry.
          for attempt in 1 2 3; do
            hdiutil create -volname Sandboxes -srcfolder dmg -format UDZO -ov "$dmg" && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done
          echo "dmg=$dmg" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: Sandboxes
          path: ${{ steps.package.outputs.dmg }}
          if-no-files-found: error

      # Sparkle in the app reads appcast.xml from the latest release. It lists
      # the release's DMG, its release notes and an EdDSA signature that the
      # app checks against its SUPublicEDKey before installing the update.
      - name: Generate appcast
        if: github.event_name == 'release'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          DMG: ${{ steps.package.outputs.dmg }}
          TAG: ${{ github.event.release.tag_name }}
          NOTES: ${{ github.event.release.body }}
          RELEASE_URL: ${{ github.event.release.html_url }}
        run: |
          public_key=$(/usr/libexec/PlistBuddy -c "Print :SUPublicEDKey" build/Build/Products/Release/Sandboxes.app/Contents/Info.plist)
          if [ -z "$public_key" ]; then
            echo "::error::SPARKLE_PUBLIC_ED_KEY in project.yml is empty, so the app can't install updates"
            exit 1
          fi
          if [ -z "$SPARKLE_PRIVATE_KEY" ]; then
            echo "::error::The SPARKLE_PRIVATE_KEY secret isn't set, so the release can't be signed"
            exit 1
          fi

          mkdir sparkle appcast
          curl -fsSL "https://github.com/sparkle-project/Sparkle/releases/download/$SPARKLE_VERSION/Sparkle-$SPARKLE_VERSION.tar.xz" \
            | tar -xJ -C sparkle

          # generate_appcast reads the version from the app in the DMG, and
          # embeds release notes from a Markdown file with the DMG's name.
          cp "$DMG" appcast/
          printf '%s\n' "${NOTES:-See the release on GitHub.}" > "appcast/${DMG%.dmg}.md"
          echo "$SPARKLE_PRIVATE_KEY" | sparkle/bin/generate_appcast \
            --ed-key-file - \
            --download-url-prefix "https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/" \
            --embed-release-notes \
            --link "$RELEASE_URL" \
            --maximum-versions 1 \
            -o appcast.xml \
            appcast
          cat appcast.xml
          # generate_appcast leaves the signature out, rather than failing, when
          # the private key doesn't match the app's public key.
          if ! grep -q 'sparkle:edSignature=' appcast.xml; then
            echo "::error::The appcast isn't signed. Check SPARKLE_PRIVATE_KEY matches SPARKLE_PUBLIC_ED_KEY"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        if: github.event_name == 'release'
        with:
          name: appcast
          path: appcast.xml
          if-no-files-found: error

  release:
    name: Attach DMG and appcast to release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To start the Website workflow.
      actions: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Sandboxes

      - uses: actions/download-artifact@v4
        with:
          name: appcast

      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          DMG: ${{ needs.build.outputs.dmg }}
        run: gh release upload "$TAG" "$DMG" appcast.xml --clobber --repo "$GITHUB_REPOSITORY"

      # Redeploys the website so its release button shows this release. It's
      # started here, once the DMG is attached, rather than by pages.yml
      # listening for releases: a release runs on its tag, and the
      # github-pages environment only lets main deploy.
      - name: Update the website
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
