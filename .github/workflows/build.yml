name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build sbx-manager.app
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project sbx-manager.xcodeproj \
            -scheme sbx-manager \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGN_STYLE=Manual

      - name: Check bundle names
        run: |
          plist=build/Build/Products/Release/sbx-manager.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c 'Print :CFBundleName' -c 'Print :CFBundleDisplayName' -c 'Print :CFBundleExecutable' "$plist"

      # The DMG window shows the app next to an Applications shortcut to drag it onto.
      - name: Package DMG
        run: |
          mkdir dmg
          ditto build/Build/Products/Release/sbx-manager.app dmg/sbx-manager.app
          ln -s /Applications dmg/Applications
          # hdiutil sometimes fails with "Resource busy" on hosted runners, so retry.
          for attempt in 1 2 3; do
            hdiutil create -volname "Docker Sandboxes Manager" -srcfolder dmg -format UDZO -ov sbx-manager.dmg && break
            if [ "$attempt" = 3 ]; then exit 1; fi
            sleep 5
          done

      - uses: actions/upload-artifact@v4
        with:
          name: sbx-manager
          path: sbx-manager.dmg
          if-no-files-found: error
