name: Website

# Publishes site/ to GitHub Pages at https://geofflamrock.github.io/Sandboxes/.
# The icon (the favicon) and its artwork without the background (the header)
# are copied from Design/ so there's only one copy of each.
# The release button finds the latest release in the browser, so releases
# don't need to redeploy the site.

on:
  push:
    branches: [main]
    paths:
      - site/**
      - Design/AppIcon.svg
      - Design/AppIconArtwork.svg
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Assemble site
        run: |
          mkdir _site
          cp -R site/. _site/
          cp Design/AppIcon.svg Design/AppIconArtwork.svg _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
